<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --text: #222;
      --muted: #666;
      --border: #dedede;
      --soft-bg: #f7f5f1;
      --card-bg: #ffffff;
      --accent: #8a4b22;
      --accent-soft: #efe3d6;
      --max-width: 1080px;
    }

    body {
      margin: 0;
      font-family: "Times New Roman", Georgia, serif;
      color: var(--text);
      line-height: 1.65;
      background: #fff;
      font-size: 17px;
    }

    a {
      color: #5a2ca0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Cover */
    .cover-container {
      width: 100%;
      overflow: hidden;
      background: #000;
      border-bottom: 1px solid #ddd;
    }

    .cover-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Main content */
    .content {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 3.2em 1.5em 4.5em;
    }

    h2 {
      font-size: 1.65em;
      line-height: 1.25;
      margin-top: 2.6em;
      margin-bottom: 0.85em;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 1.25em;
      margin-top: 1.6em;
      margin-bottom: 0.5em;
    }

    h4 {
      font-size: 1.05em;
      margin-top: 1.2em;
      margin-bottom: 0.35em;
    }

    p {
      margin: 0.65em 0 1em;
    }

    ul {
      padding-left: 1.35em;
    }

    li {
      margin: 0.15em 0;
    }

    strong {
      font-weight: 700;
    }

    /* Intro text */
    .lead {
      font-size: 1.08em;
      color: #333;
      max-width: 820px;
    }

    /* Link cards */
    .link-card {
      display: inline-block;
      padding: 0.65em 0.95em;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft-bg);
      font-size: 0.98em;
      margin-top: 0.35em;
    }

    .link-card a {
      font-weight: 600;
    }

    /* Speakers + Schedule */
    .speakers-schedule-section {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.2fr);
      gap: 42px;
      align-items: start;
      margin-top: 2.8em;
    }

    .speakers-column,
    .schedule-column {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25em 1.35em 1.35em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.035);
    }

    .speakers-column h2,
    .schedule-column h2 {
      margin-top: 0;
      font-size: 1.45em;
    }

    .speakers-column ul {
      margin-bottom: 0;
    }

    .speaker-note {
      color: var(--muted);
      font-size: 0.92em;
    }

    .schedule-pdf {
      width: 100%;
      height: 610px;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      display: block;
      background: #f8f8f8;
    }

    .schedule-download-link {
      margin-top: 0.75em;
      font-size: 0.95em;
    }

    .schedule-download-link a {
      display: inline-block;
      padding: 0.45em 0.75em;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--soft-bg);
      font-weight: 600;
    }

    /* Workshop format */
    .venue-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 1.2em;
    }

    .venue-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1em 1.25em;
      background: var(--soft-bg);
    }

    .venue-card h3 {
      margin-top: 0;
    }

    .venue-card p {
      margin-bottom: 0.55em;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.95em;
    }

    /* Practical information */
    .city-section {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35em 1.45em;
      margin: 1.5em 0 2em;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
    }

    .city-section h3 {
      margin-top: 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35em;
    }

    .driver-note {
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      padding: 0.75em 1em;
      margin-top: 1em;
      border-radius: 0 8px 8px 0;
    }

    .driver-note p {
      margin: 0.25em 0;
    }

    /* Tables if used later */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0 2.5em 0;
      font-size: 0.95em;
    }

    thead th {
      text-align: left;
      font-weight: normal;
      border-bottom: 1px solid #999;
      padding: 0.4em 0;
    }

    tbody td {
      padding: 0.45em 0;
      vertical-align: top;
    }

    tbody tr:not(:last-child) td {
      border-bottom: 1px solid #ddd;
    }

    td:first-child,
    th:first-child {
      width: 6em;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      body {
        font-size: 16px;
      }

      .content {
        padding: 2.3em 1.15em 3.5em;
      }

      .speakers-schedule-section {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .venue-grid {
        grid-template-columns: 1fr;
      }

      .schedule-pdf {
        height: 560px;
      }
    }

    @media (max-width: 768px) {
      .cover-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .cover-image {
        width: auto;
        height: 88vh;
        max-height: 88vh;
      }

      h2 {
        font-size: 1.45em;
      }
    }
  </style>
</head>

<body>

<div class="cover-container">
  <img
    src="/bhz-moduli-workshop/assets/images/cover.png"
    alt="Beijing-Hangzhou-Zurich Moduli Workshop"
    class="cover-image"
  />
</div>

<div class="content">
  {{ content }}
</div>

</body>
</html>
